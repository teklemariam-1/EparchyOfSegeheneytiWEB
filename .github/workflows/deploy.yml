name: Deploy to Vercel

# ── Trigger ────────────────────────────────────────────────────────────────
# Only deploy after the CI workflow completes successfully on main.
# This guarantees lint, type-check, and unit tests pass before every release.
on:
  workflow_run:
    workflows: ["CI"]
    branches: [main]
    types: [completed]
  workflow_dispatch: # Allow manual deploys from the Actions tab

# Only one production deploy at a time — never cancel an in-progress deploy.
concurrency:
  group: deploy-production
  cancel-in-progress: false

jobs:
  deploy:
    name: Deploy → Vercel Production
    runs-on: ubuntu-latest
    # Skip if CI did not succeed (only applies to workflow_run trigger)
    if: ${{ github.event_name == 'workflow_dispatch' || github.event.workflow_run.conclusion == 'success' }}
    timeout-minutes: 30
    environment:
      name: production
      url: https://www.segeneyti.org

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          # Deploy exactly the commit CI validated. Without this, checkout takes
          # the branch HEAD at deploy time, so a commit pushed between CI passing
          # and this job starting would ship unvalidated. For workflow_dispatch
          # (no workflow_run context) this falls back to the default ref.
          ref: ${{ github.event.workflow_run.head_sha || github.ref }}

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'

      - name: Install Vercel CLI
        run: npm install --global vercel@latest

      - name: Install dependencies
        run: npm ci

      # ── Pull production env vars & project metadata from Vercel ────────────
      # This writes .vercel/.env.production.local which `vercel build` will use.
      - name: Pull Vercel environment
        run: vercel pull --yes --environment=production --token=${{ secrets.VERCEL_TOKEN }}
        env:
          VERCEL_ORG_ID: ${{ secrets.VERCEL_ORG_ID }}
          VERCEL_PROJECT_ID: ${{ secrets.VERCEL_PROJECT_ID }}

      # ── Export ONLY the database URL from the Vercel pull output ───────────
      # This previously appended the whole of .vercel/.env.production.local to
      # $GITHUB_ENV. That exported every production secret into the job env,
      # where GitHub prints them verbatim in step logs -- masking only applies
      # to values registered as repository secrets, which these are not, so
      # CRON_SECRET and friends appeared in cleartext. It also corrupted
      # DATABASE_URI (migrations resolved a host of literally "base"), because
      # any value containing newlines or '=' breaks the KEY=VALUE format.
      #
      # Export only the variables migrations need (src/lib/env.ts requires
      # DATABASE_URI and PAYLOAD_SECRET in production), each masked explicitly.
      - name: Export database URL for migrations
        run: |
          set -uo pipefail
          f=.vercel/.env.production.local
          if [ ! -f "$f" ]; then
            echo "::warning::$f not found; skipping migrations"
            exit 0
          fi
          # Payload migrations run DDL and need a DIRECT (non-pooled)
          # connection. Neon's pooled URL goes through pgBouncer; Vercel
          # exposes the direct one as POSTGRES_URL_NON_POOLING.
          url=$(grep -m1 '^POSTGRES_URL_NON_POOLING=' "$f" | cut -d= -f2- | tr -d '"')
          if [ -z "$url" ]; then
            url=$(grep -m1 '^DATABASE_URI=' "$f" | cut -d= -f2- | tr -d '"')
          fi
          if [ -z "$url" ]; then
            echo "::warning::no database URL found; skipping migrations"
            exit 0
          fi
          echo "::add-mask::$url"
          echo "DATABASE_URI=$url" >> "$GITHUB_ENV"
          # Payload's env validation (src/lib/env.ts) refuses to boot in
          # production without PAYLOAD_SECRET, so migrations need it too.
          secret=$(grep -m1 '^PAYLOAD_SECRET=' "$f" | cut -d= -f2- | tr -d '"')
          if [ -n "$secret" ]; then
            echo "::add-mask::$secret"
            echo "PAYLOAD_SECRET=$secret" >> "$GITHUB_ENV"
          else
            echo "::warning::PAYLOAD_SECRET not found in Vercel env; migrations may fail env validation"
          fi
          echo "Database URL and Payload secret exported (masked)."

      # ── Run database migrations before the build ───────────────────────────
      # DATABASE_URI comes from the step above (direct, non-pooled connection).
      #
      # Why this is verbose: a previous deploy's migrate exited 0 in ~3s with no
      # output and left a migration unapplied, so the app deployed against a
      # schema it expected but did not have. We now (1) print the target DB host
      # (credentials stripped) so the DB CI migrates is never ambiguous, (2) show
      # migrate:status before and after, and (3) FAIL the step if any migration
      # is still pending afterwards, so schema drift blocks the deploy instead of
      # shipping silently.
      - name: Run database migrations
        id: migrate
        run: |
          set -uo pipefail
          echo "── migrate:status (before) ─────────────────────────────"
          npx payload migrate:status || true

          echo "── migrate ─────────────────────────────────────────────"
          npx payload migrate

          echo "── verify (declared files vs payload_migrations) ───────"
          # Deterministic check: fails the step (and blocks the deploy below)
          # if any migration file is not recorded as applied. Prints the target
          # DB host so the migrated database is never ambiguous.
          node scripts/check-migrations.mjs
        env:
          NODE_ENV: production

      # ── Deploy to Vercel Production ────────────────────────────────────────
      # vercel deploy --prod uploads source to Vercel and triggers a remote
      # build on Vercel's own infrastructure (where all env vars are available).
      # We do NOT run 'payload generate:types' or 'next build' locally because:
      #   - payload generate:types requires a live DB connection (timeouts in CI)
      #   - payload-types.ts and importMap.js are already committed to the repo
      #   - Vercel's remote build environment has all required env vars configured
      - name: Deploy to Vercel Production
        id: deploy
        run: |
          set -o pipefail
          # Capture the exit status explicitly. `OUTPUT=$(...)` under bash -e
          # aborts the step on failure BEFORE the echo, so a rejected
          # deployment produced an exit code and no explanation -- which is how
          # a vercel.json cron the plan disallows looked like a silent failure.
          if ! OUTPUT=$(vercel deploy --prod \
            --archive=tgz \
            --token=${{ secrets.VERCEL_TOKEN }} \
            2>&1 | sed 's/\x1b\[[0-9;]*m//g'); then
            echo "$OUTPUT"
            echo "::error::vercel deploy failed -- see the CLI output above."
            exit 1
          fi
          echo "$OUTPUT"
          # vercel deploy --prod outputs the deployment URL on the last line
          DEPLOYMENT_URL=$(echo "$OUTPUT" | grep -oE 'https://[a-zA-Z0-9._-]+\.vercel\.app' | tail -1)
          if [ -z "$DEPLOYMENT_URL" ]; then
            # Fallback: use production domain
            DEPLOYMENT_URL="https://www.segeneyti.org"
          fi
          echo "deployment_url=$DEPLOYMENT_URL" >> $GITHUB_OUTPUT
          echo "Deployed to: $DEPLOYMENT_URL"
        env:
          VERCEL_ORG_ID: ${{ secrets.VERCEL_ORG_ID }}
          VERCEL_PROJECT_ID: ${{ secrets.VERCEL_PROJECT_ID }}
          SENTRY_AUTH_TOKEN: ''

      # ── Smoke tests against the live deployment ─────────────────────────────
      # Give Vercel a moment to fully propagate the deploy.
      - name: Wait for deployment propagation
        run: sleep 30

      - name: Smoke test — home page (HTTP 200)
        run: |
          URL="${{ steps.deploy.outputs.deployment_url }}"
          echo "Testing: $URL/"
          status=$(curl -L -o /dev/null -s -w "%{http_code}" --max-time 30 "$URL/")
          echo "Home: $status"
          test "$status" = "200"

      - name: Smoke test — /sitemap.xml
        run: |
          URL="${{ steps.deploy.outputs.deployment_url }}"
          status=$(curl -L -o /dev/null -s -w "%{http_code}" --max-time 30 "$URL/sitemap.xml")
          echo "Sitemap: $status"
          test "$status" = "200"

      - name: Smoke test — /robots.txt
        run: |
          URL="${{ steps.deploy.outputs.deployment_url }}"
          status=$(curl -L -o /dev/null -s -w "%{http_code}" --max-time 30 "$URL/robots.txt")
          echo "Robots: $status"
          test "$status" = "200"

      - name: Smoke test — /api/health (Payload alive)
        run: |
          URL="${{ steps.deploy.outputs.deployment_url }}"
          status=$(curl -L -o /dev/null -s -w "%{http_code}" --max-time 30 "$URL/api/health")
          echo "Health: $status"
          test "$status" = "200" || test "$status" = "404"
